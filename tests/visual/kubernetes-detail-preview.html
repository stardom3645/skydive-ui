<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kubernetes Detail Visual Regression</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; color: #101828; background: #eef2f6; font-family: Arial, sans-serif; }
        .visual-regression-page { min-height: 100vh; padding: 24px; }
        .visual-regression-panel { margin: 0 auto; background: #fff; box-shadow: 0 6px 24px rgba(16, 24, 40, .12); }
        .visual-regression-header { padding: 12px 16px; border-bottom: 2px solid #1677ff; }
        .visual-regression-content { display: flex; flex-direction: column; gap: 12px; padding: 12px; }
        .visual-regression-metrics { padding: 10px 14px 12px; }
        .visual-regression-metrics > * + * { margin-top: 10px; padding-top: 10px; border-top: 1px solid #eef1f5; }
    </style>
</head>
<body>
<div id="root"></div>
</body>
</html>
